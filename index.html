<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Rayssa Chrystina</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{max-width:430px;margin:0 auto;min-height:100vh;background:#ffe9e5}
.tela{position:relative;width:100%;max-width:430px;min-height:100vh;overflow:hidden;background:#fff}
.tela img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.area-btn{position:absolute;left:12%;right:12%;bottom:8.5%;height:56px;background:transparent;border:none;cursor:pointer;border-radius:999px;z-index:5}
.num{position:absolute;left:15%;top:22.5%;font-size:64px;font-weight:600;color:#f08a9a;z-index:5}
.num2{position:absolute;left:38%;top:25%;font-size:18px;line-height:1.2;color:#7a3a3a;z-index:5}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.btn{display:block;background:#f43f6e;color:#fff;text-align:center;padding:14px;border-radius:999px;font-weight:600;border:none;width:100%;cursor:pointer}
input,textarea{width:100%;padding:13px;border:1.5px solid #f3d1d9;border-radius:14px;margin-bottom:10px;outline:none}
.hidden{display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.98);display:flex;justify-content:space-around;padding:10px 0 18px;z-index:10;border-top:1px solid #fde2e8}
.nav button{background:none;border:none;font-size:11px;color:#a58a90;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.active{color:#e91e63;font-weight:600}
.conteudo{position:relative;z-index:2;background:#fff5f3;min-height:100vh;padding:20px 0 100px}
</style>
</head>
<body>

<!-- INICIO -->
<div id="tab-inicio">
  <!-- SEM CLIENTE = TUA FOTO 1 -->
  <div id="tela-vazia" class="tela">
    <img src="fundo.png" class="bg">
    <button class="area-btn" onclick="goTab('clientes')"></button>
  </div>
  <!-- COM CLIENTE = TUA FOTO 2 -->
  <div id="tela-cheia" class="tela hidden">
    <img src="dashboard.png" class="bg">
    <div class="num" id="nClientes">0</div>
    <div class="num2"><span id="nAtivos">0</span> clientes<br>ativos • <span id="nAgend">0</span> agendamentos</div>
  </div>
</div>

<!-- CLIENTES -->
<div id="tab-clientes" class="hidden"><div class="conteudo">
  <div class="card" style="text-align:left"><h2>+ Cadastrar cliente</h2><div style="height:12px"></div>
  <input id="nome" placeholder="Nome - Ex: Ester">
  <input id="zap" placeholder="WhatsApp">
  <input id="data" type="date">
  <textarea id="obs" rows="2" placeholder="Observação"></textarea>
  <button class="btn" onclick="salvar()">Cadastrar Cliente</button></div>
  <div id="lista"></div>
</div></div>

<!-- AGENDAMENTOS -->
<div id="tab-agend" class="hidden"><div class="conteudo"><div class="card"><p>Seus agendamentos vão aparecer aqui.</p></div></div></div>

<!-- PERFIL -->
<div id="tab-perfil" class="hidden"><div class="conteudo"><div class="card"><h2>Studio Rayssa Chrystina</h2><p>Divinéia, São Luís - MA<br>Atendimento com amor e cuidado</p></div></div></div>

<nav class="nav">
  <button class="active" onclick="goTab('inicio',this)">🏠<br>Início</button>
  <button onclick="goTab('clientes',this)">▤<br>Clientes</button>
  <button onclick="goTab('agend',this)">📅<br>Agendamentos</button>
  <button onclick="goTab('perfil',this)">👤<br>Perfil</button>
</nav>

<script>
let clientes=JSON.parse(localStorage.getItem('rayssa_clientes')||'[]');
function goTab(id,btn){
  ['inicio','clientes','agend','perfil'].forEach(t=>document.getElementById('tab-'+t).classList.add('hidden'));
  document.getElementById('tab-'+id).classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}
function salvar(){
  const nome=document.getElementById('nome').value.trim();
  if(!nome) return alert('Coloca o nome da cliente');
  clientes.push({nome, zap:document.getElementById('zap').value, data:document.getElementById('data').value});
  localStorage.setItem('rayssa_clientes', JSON.stringify(clientes));
  document.getElementById('nome').value='';
  alert('Cadastrada! 💖'); goTab('inicio');
}
function render(){
  const tem=clientes.length>0;
  document.getElementById('tela-vazia').classList.toggle('hidden', tem);
  document.getElementById('tela-cheia').classList.toggle('hidden', !tem);
  document.getElementById('nClientes').innerText=clientes.length;
  document.getElementById('nAtivos').innerText=clientes.length;
  document.getElementById('lista').innerHTML=clientes.map(c=>`<div class="card" style="text-align:left"><b>${c.nome}</b><br><span style="font-size:12px;color:#888">${c.zap||''}</span></div>`).join('');
}
render();
</script>
</body>
</html>
