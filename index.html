<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Studio Rayssa Chrystina</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{max-width:430px;margin:0 auto;background:#fde8e6;min-height:100vh;padding-bottom:82px;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}

/* ===== TELA 1 - EXATA DA FOTO ===== */
.tela1{background:linear-gradient(180deg,#f9aab9 0%,#fbc6cd 18%,#fde8e6 42%);padding:0 0 8px;position:relative;overflow:hidden}
.topo{position:relative;text-align:center;padding:24px 16px 0}
.topo::before{content:"";position:absolute;top:16px;left:10px;right:10px;height:1px;background:#c9a24a;transform:rotate(-3deg)}
.topo::after{content:"";position:absolute;top:22px;left:10px;right:10px;height:1px;background:#c9a24a;transform:rotate(2.8deg)}
.topo h1{font-family:'Playfair Display',serif;font-size:48px;line-height:1;color:#b82e4a;font-weight:700;letter-spacing:-.5px}
.topo .studio{font-family:'Playfair Display',serif;font-size:15.5px;color:#6b4a2a;font-weight:600;margin-top:11px}
.topo .cidade{font-size:15px;color:#6b4a2a;font-weight:400;line-height:1.4}
.topo .loc{font-size:12.5px;color:#d67a8c;margin-top:2px}
.hero{width:230px;height:198px;margin:2px auto 0;position:relative}
.circ{width:168px;height:168px;background:#fcdbe1;border-radius:50%;border:1px solid #eacaa5;position:absolute;left:50%;top:8px;transform:translateX(-50%)}
.card{background:#fff;border-radius:22px;padding:20px 18px 20px;margin:8px 16px;box-shadow:0 10px 30px rgba(180,50,80,.10);border:1px solid #fde8e0;text-align:center}
.card h2{font-size:19px;line-height:1.35;color:#24181c;font-weight:600}
.card p{font-size:12.2px;color:#8a7a7e;line-height:1.65;margin:10px 0 16px;font-weight:300}
.btn{width:100%;background:linear-gradient(180deg,#ff5a7a,#f43f6e);color:#fff;border:none;padding:15px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(244,63,110,.35);font-family:'Poppins',sans-serif}

/* ===== TELA 2 - DASHBOARD EXATO ===== */
.tela2{background:linear-gradient(180deg,#f9aab9 0%,#fbc6cd 14%,#fde8e6 26%);min-height:100vh;padding-bottom:20px}
.dash-head{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 6px;position:relative}
.dash-head::before{content:"";position:absolute;top:14px;left:10px;right:10px;height:1px;background:#c9a24a;transform:rotate(-3deg)}
.dash-head::after{content:"";position:absolute;top:20px;left:10px;right:10px;height:1px;background:#c9a24a;transform:rotate(2.8deg)}
.dash-head h1{font-family:'Playfair Display',serif;font-size:32px;color:#9e2746;font-weight:700}
.right{display:flex;gap:16px;align-items:center}
.bell{font-size:25px}
.avatar{width:49px;height:49px;border-radius:50%;background:#fde8d0;border:2px solid #d4af6a;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.dash-card{background:#fff;border-radius:18px;padding:15px 16px;margin:14px 16px 10px;box-shadow:0 6px 20px rgba(0,0,0,.06);border:1px solid #fde8e0}
.label{font-size:12px;background:#fdf0e8;color:#7a3a2a;padding:5px 10px;border-radius:6px;display:inline-block;font-weight:600}
.big{display:flex;align-items:center;gap:14px;margin-top:5px}
.big-num{font-size:58px;color:#f08a9a;font-weight:700;line-height:1}
.big-txt{font-size:14.5px;color:#5a3a3a;line-height:1.35}
.row{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:16px;margin:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.05);border:1px solid #fdf0e8}
